<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swimming Pool Management System</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <div class="logo">IITGN Swimming Pool</div>
        <ul class="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="login.html" class="btn btn-primary">Login</a></li>
          <li><a href="register.html" class="btn btn-success">Register</a></li>
        </ul>
      </div>
    </nav>

    <main>

      <section class="plans-overview">
        <div class="container">
          <h2>Plans</h2>
          <div class="plans-grid" id="publicPlansGrid">
            <p class="empty-state">Loading current plans...</p>
          </div>
        </div>
      </section>
    </main>

    <script>
      async function loadPublicPlans() {
        const grid = document.getElementById("publicPlansGrid");
        try {
          const response = await fetch("/api/plans");
          const plans = await response.json();
          if (!response.ok) throw new Error("Unable to load plans");
          grid.replaceChildren();
          if (plans.length === 0) {
            grid.innerHTML = '<p class="empty-state">No plans are available right now.</p>';
            return;
          }

          plans.forEach((plan) => {
            const card = document.createElement("article");
            card.className = "plan-card";
            const ageRange = plan.age_max === null ? `${plan.age_min}+` : `${plan.age_min}-${plan.age_max}`;
            const age = document.createElement("h3");
            age.textContent = `Ages ${ageRange}`;
            const price = document.createElement("p");
            price.className = "price";
            price.textContent = `₹${Number(plan.price).toFixed(2)}`;
            const details = document.createElement("p");
            const duration = { daily: "One day", monthly: "Monthly", annual: "Annual" }[plan.duration_type] || `${plan.duration_days} days`;
            details.textContent = duration;
            card.append(age, price, details);
            grid.appendChild(card);
          });
        } catch (error) {
          grid.innerHTML = '<p class="empty-state">Plans are temporarily unavailable.</p>';
        }
      }

      loadPublicPlans();
    </script>
  </body>
</html>
